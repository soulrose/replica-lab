<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replica Lab</title>
<style>
  :root { --ink: #1d1847; --muted: #5d5a8a; --line: #d9d7f2; --yellow: #ffd23f; --green: #22c55e; --red: #ff4d6d; --violet: #7c5cff;
          --font: "Leelawadee UI", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; --hud: "Bahnschrift", "Segoe UI", sans-serif;
          --mono: "Cascadia Mono", Consolas, monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; color: var(--ink); font: 14px/1.55 var(--font);
         background: radial-gradient(circle at 12% -5%, rgba(120,190,255,.75), transparent 42%), radial-gradient(circle at 105% 15%, rgba(255,110,200,.45), transparent 40%),
                     repeating-linear-gradient(45deg, rgba(255,255,255,.045) 0 2px, transparent 2px 26px), linear-gradient(160deg, #3d5afe, #6c3df5 55%, #9b3df0); }
  .card { width: min(560px, 100%); background: #fff; border: 2.5px solid var(--ink); border-radius: 20px; box-shadow: 0 7px 0 rgba(29,24,71,.35); padding: 26px 26px 22px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 48px; height: 48px; }
  h1 { font: 800 26px/1 var(--hud); margin: 0; }
  #step { margin: 20px 0 10px; font: 700 17px var(--hud); }
  .track { height: 14px; border: 2.5px solid var(--ink); border-radius: 8px; background: #ecebff; overflow: hidden; }
  .track i { display: block; height: 100%; width: 35%; border-radius: 4px; background: linear-gradient(90deg, #19c6e6, var(--violet), #ff5fa2);
             animation: slide 1.4s ease-in-out infinite alternate; }
  .done .track i { width: 100%; animation: none; background: var(--green); }
  .err .track i { width: 100%; animation: none; background: var(--red); }
  @keyframes slide { from { margin-left: 0; } to { margin-left: 65%; } }
  pre { margin: 14px 0 0; max-height: 180px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 11.5px/1.45 var(--mono);
        color: #c9f7dc; background: #17143a; border: 2px solid var(--ink); border-radius: 12px; padding: 9px 11px; }
  .hint { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
  button { margin-top: 14px; min-height: 38px; padding: 6px 18px; cursor: pointer; font: 700 14px var(--hud); color: var(--ink); background: var(--yellow);
           border: 2.5px solid var(--ink); border-radius: 11px; box-shadow: 0 4px 0 var(--ink); }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  @media (prefers-reduced-motion: reduce) { .track i { animation: none; width: 60%; } }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <defs><linearGradient id="mk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8462ee"/><stop offset="1" stop-color="#3a2496"/></linearGradient></defs>
      <rect x="1.5" y="1.5" width="37" height="37" rx="10" fill="url(#mk)" stroke="#1d1847" stroke-width="2.5"/>
      <rect x="13" y="7" width="20" height="14" rx="4" fill="#fff" opacity=".55"/><rect x="10" y="13" width="20" height="14" rx="4" fill="#fff" opacity=".8"/>
      <rect x="7" y="19" width="20" height="14" rx="4" fill="#fff"/><circle cx="23" cy="26" r="2" fill="#22c55e"/>
    </svg>
    <h1>Replica Lab</h1>
  </div>
  <div id="step" aria-live="polite">กำลังเตรียมฐาน…</div>
  <div class="track"><i></i></div>
  <pre id="lines" hidden></pre>
  <p class="hint" id="hint">ปิดหน้าต่างนี้เมื่อไหร่ ระบบจะหยุด replica ทั้งหมดให้เอง และจำ image กับจำนวน replica ไว้ใช้ครั้งหน้า</p>
  <button id="retry" hidden>ลองใหม่</button>
</main>
<script>
const $ = id => document.getElementById(id);
const APP = `http://${location.hostname}:18090/`;
const H = { "X-Replica-Lab": "1" };
const PAGE_ID = Math.random().toString(36).slice(2);
const ping = () => fetch(`/ping?p=${PAGE_ID}`).catch(() => {});
setInterval(ping, 10000); ping();
addEventListener("pagehide", () => navigator.sendBeacon("/bye", JSON.stringify({ p: PAGE_ID })));

// what the script is doing, in plain words, from its latest output line
function stepText(lines) {
  const l = [...lines].reverse().join("\n");
  if (/not installed/i.test(l)) return "ยังไม่ได้ติดตั้ง Docker Desktop เปิดหน้าดาวน์โหลดให้แล้ว";
  if (/waiting for Docker|starting it/i.test(l)) return "กำลังเปิด Docker Desktop (ครั้งแรกอาจใช้ 1-3 นาที)";
  if (/RAM auto|watching RAM|trial/i.test(l)) return "กำลังวัด RAM ของแอป (รัน container ทดลอง 1 ตัว)";
  if (/stack deploy|retry/i.test(l)) return "กำลังส่งยูนิตลงสนาม (deploy stack)";
  if (/Scaler image/i.test(l)) return "กำลังเตรียมหน้า Replica Lab";
  if (/ramaservice image/i.test(l)) return "กำลังเช็ค image";
  return "กำลังเช็ค Docker";
}
let timer = null, startedAt = Date.now();
async function poll() {
  try {
    const r = await fetch("/launch/status", { headers: H });
    const s = await r.json();
    const lines = s.launch?.lines || [];
    if (lines.length) { $("lines").hidden = false; $("lines").textContent = lines.slice(-10).join("\n"); $("lines").scrollTop = 1e6; }
    if (s.ready) {
      $("card").className = "card done"; $("step").textContent = "พร้อมแล้ว กำลังเข้า Replica Lab";
      clearInterval(timer);
      setTimeout(() => location.replace(APP), 400);
      return;
    }
    if (s.launch?.state === "error") {
      $("card").className = "card err";
      $("step").textContent = /not installed/i.test(lines.join("\n")) ? "ยังไม่ได้ติดตั้ง Docker Desktop" : "เปิดไม่สำเร็จ";
      $("hint").textContent = /not installed/i.test(lines.join("\n"))
        ? "เปิดหน้าดาวน์โหลด Docker Desktop ให้แล้ว ติดตั้งและเปิด Docker ครั้งแรกก่อน แล้วกดลองใหม่"
        : "ดูข้อความด้านบน แก้แล้วกดลองใหม่";
      $("retry").hidden = false;
      clearInterval(timer);
      return;
    }
    if (s.launch?.state === "done" && !s.up) $("step").textContent = "deploy เสร็จ รอหน้า Replica Lab ตอบ…";
    else $("step").textContent = stepText(lines);
  } catch { $("step").textContent = "รอตัวช่วยบนเครื่อง…"; }
}
async function start() {
  $("card").className = "card"; $("retry").hidden = true; $("step").textContent = "กำลังเตรียมฐาน…";
  try { await fetch("/launch/start", { method: "POST", headers: H }); } catch { /* poll shows it */ }
  clearInterval(timer); timer = setInterval(poll, 1000); poll();
}
$("retry").onclick = start;
start();
</script>
</body>
</html>
